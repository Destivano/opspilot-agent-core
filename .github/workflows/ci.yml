name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: node --check src/static/app.js
      - run: cfn-lint template.yaml
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-ui.txt
      - run: python -m playwright install --with-deps chromium
      - name: Start local simulation
        run: |
          python scripts/local_demo.py > /tmp/opspilot-demo.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/config; then exit 0; fi
            sleep 1
          done
          cat /tmp/opspilot-demo.log
          exit 1
      - run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshots
          path: test-results/
